image: node:22

stages:
  - deploy

pages:
  stage: deploy
  script:
    - cd client
    - npm ci
    - npm run build
    - cd ..
    - cp -r client/dist public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
